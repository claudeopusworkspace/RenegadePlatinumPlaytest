[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Legacy DeSmuME tests need .dst save states — skip by default.
# Run explicitly with: pytest tests/legacy/ -v
norecursedirs = legacy
# `-n auto` delegates worker count to pytest_xdist_auto_num_workers in
# conftest.py, which returns one worker per running .melonds_test_bridge_*.sock
# (0 ⇒ sequential when fewer than two sockets exist). `--dist loadfile` groups
# tests by file so each worker pays emulator-setup cost once per file, not per
# test. CLI `-n N` still wins (last-value-wins in argparse).
# Show duration for every test (0 = all, not just slowest N)
addopts = --durations=0 -n auto --dist loadfile
# Mark all tests as integration (require live emulator)
markers =
    slow: marks tests as slow (auto_grind multi-iteration)
